<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradient for the main logo -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00cc6a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#009944;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Inner glow for depth -->
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="0"/>
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background circle (optional, for favicon use) -->
  <circle cx="256" cy="256" r="240" fill="#0a0a0a" stroke="url(#logoGradient)" stroke-width="4"/>
  
  <!-- Main logo mark - stylized 'W' with lightning bolt -->
  <g filter="url(#glow)">
    <!-- Outer hexagon/circuit board shape -->
    <path d="M256 64 L416 128 L416 384 L256 448 L96 384 L96 128 Z" 
          fill="none" stroke="url(#logoGradient)" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Inner circuit traces -->
    <path d="M256 128 L256 256" stroke="url(#logoGradient)" stroke-width="4" stroke-linecap="round"/>
    <path d="M160 224 L256 256" stroke="url(#logoGradient)" stroke-width="3" stroke-linecap="round"/>
    <path d="M352 224 L256 256" stroke="url(#logoGradient)" stroke-width="3" stroke-linecap="round"/>
    <path d="M256 256 L256 384" stroke="url(#logoGradient)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Central node -->
    <circle cx="256" cy="256" r="24" fill="url(#logoGradient)" filter="url(#innerGlow)"/>
    <circle cx="256" cy="256" r="12" fill="#0a0a0a"/>
    <circle cx="256" cy="256" r="6" fill="url(#logoGradient)"/>
    
    <!-- Corner nodes (capacitor-like) -->
    <g fill="url(#logoGradient)">
      <rect x="140" y="160" width="20" height="20" rx="3"/>
      <rect x="352" y="160" width="20" height="20" rx="3"/>
      <rect x="140" y="332" width="20" height="20" rx="3"/>
      <rect x="352" y="332" width="20" height="20" rx="3"/>
    </g>
    
    <!-- Small circuit dots on hexagon edges -->
    <g fill="#00ff88" opacity="0.8">
      <circle cx="144" cy="172" r="4"/>
      <circle cx="368" cy="172" r="4"/>
      <circle cx="100" cy="256" r="4"/>
      <circle cx="412" cy="256" r="4"/>
      <circle cx="144" cy="340" r="4"/>
      <circle cx="368" cy="340" r="4"/>
    </g>
  </g>
  
  <!-- WattLab text mark (for horizontal layout) -->
  <g id="textMark" transform="translate(256, 480)">
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" 
          font-weight="700" font-size="32" fill="url(#logoGradient)" letter-spacing="4">
      WATTLAB
    </text>
  </g>
</svg>