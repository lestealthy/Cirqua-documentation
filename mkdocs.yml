# ===========================================================================
# CIRQUA Technical Documentation - MkDocs configuration
#
# Follows the WattLab documentation standard (general_rules):
#   - site_url / repo_url / repo_name always set, never placeholders
#   - use_directory_urls: false  (prevents GitHub Pages redirect loops)
#   - Roboto / Roboto Mono typography
#
# Deliberate deviations from the generic WattLab template, mandated by the
# CIRQUA brand direction:
#   - LIGHT ONLY. A single `default` scheme, no slate, no toggle.
#   - Blue principal accent (WattLab blue family).
# ===========================================================================

site_name: CIRQUA Technical Documentation
site_description: >-
  Embedded monitoring and instrumentation platform documentation for the
  CIRQUA Waterwise Futures initiative - nodes, sensors, firmware, calibration
  and field service.
site_author: WattLab Engineering
site_url: https://lestealthy.github.io/Cirqua-documentation/
repo_url: https://github.com/lestealthy/Cirqua-documentation
repo_name: Cirqua-documentation
copyright: >-
  Documentation by WattLab Engineering for the CIRQUA Waterwise Futures
  initiative. CIRQUA is a Horizon Europe funded project. CIRQUA and
  African Biotechnology Company names and marks belong to their respective
  owners.

# CRITICAL - WattLab standard. Prevents redirect loops on GitHub Pages
# subdirectory deployments and gives stable, QR-friendly flat URLs
# (e.g. /nodes/node1.html).
use_directory_urls: false

theme:
  name: material
  # LIGHT ONLY - single scheme, no dark theme, no toggle.
  palette:
    scheme: default
    primary: custom
    accent: custom
  # Theme overrides live OUTSIDE docs/ so that template source is not copied
  # into the published site by the static-file copy step.
  custom_dir: overrides

  font:
    text: Roboto
    code: Roboto Mono

  icon:
    logo: material/water
    repo: fontawesome/brands/github

  favicon: assets/branding/cirqua/favicon.png

  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.expand
    - navigation.tabs
    - navigation.tabs.sticky
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - content.tabs.link
    - content.action.edit

plugins:
  - search
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
  # NOTE: only options supported by the pinned version
  # (mkdocs-git-revision-date-plugin 0.3.2) are used here. The `type` and
  # `strict` options belong to the 1.x line and would abort a strict build.
  # The plugin is enabled on CI and disabled for local builds so that a
  # shallow or unpinned local clone cannot fail the build.
  - git-revision-date:
      enabled: !ENV [CI, false]

# Generated fragments are included into pages by pymdownx.snippets; they are
# not pages in their own right. Without this they would be copied into the
# published site as standalone HTML files with links that resolve relative to
# the wrong directory.
exclude_docs: |
  assets/generated/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - abbr
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # Snippets are pre-extracted into docs/assets/snippets/ by
  # scripts/extract_code_snippets.py so that the firmware tree outside
  # docs/ is never required at build time.
  #
  # base_path is pinned to docs/ because pymdownx.snippets otherwise resolves
  # an embed relative to the directory of the page that includes it, which
  # would break the shared "assets/snippets/<id>.cpp" convention used by every
  # page regardless of depth.
  - pymdownx.snippets:
      base_path:
        - !relative $config_dir/docs
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys

extra_css:
  - stylesheets/extra.css
  - stylesheets/footer.css
  - stylesheets/components.css

extra_javascript:
  - javascripts/extra.js
  - javascripts/explorer.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lestealthy/Cirqua-documentation
      name: CIRQUA documentation source
    - icon: fontawesome/brands/github
      link: https://github.com/lestealthy/Cirqua
      name: CIRQUA firmware repository
    - icon: material/water
      link: https://cirqua-water.eu/
      name: CIRQUA official project site
  cirqua:
    firmware_repository: https://github.com/lestealthy/Cirqua
    firmware_commit: db6d9b896341a9c7d8fd01913e854b663c110d55
    firmware_commit_short: db6d9b8
    documentation_repository: https://github.com/lestealthy/Cirqua-documentation
    official_project_site: https://cirqua-water.eu/
    partner_organisation: https://www.african-biotech.com/

