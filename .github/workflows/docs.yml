# ---------------------------------------------------------------------------
# CIRQUA technical documentation - GitHub Pages deployment
#
# Deployment is gated on the full validation suite. A documentation build that
# fails validation is never published.
#
# Steps:
#   1. checkout documentation repository
#   2. checkout the firmware submodule (the documentation consumes it)
#   3. install pinned dependencies
#   4. regenerate derived assets (snippets, QR codes, favicon)
#   5. validate
#   6. mkdocs build --strict
#   7. configure Pages, upload artifact, deploy
# ---------------------------------------------------------------------------
name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a half-finished publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout documentation repository
        uses: actions/checkout@v4

      - name: Checkout firmware submodule
        run: |
          git submodule update --init --recursive
          git -C _external/Cirqua-firmware rev-parse HEAD

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate derived assets
        run: |
          python scripts/generate_source_manifest.py
          python scripts/extract_code_snippets.py
          python scripts/generate_qr_codes.py
          python scripts/generate_favicon.py

      - name: Verify internal link sources
        run: python scripts/fix_internal_links.py --check

      - name: Verify code provenance against the snippet index
        run: python scripts/verify_provenance.py

      - name: Validation suite
        run: python scripts/validate_docs.py

      - name: Build site (strict)
        run: mkdocs build --strict --clean

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4