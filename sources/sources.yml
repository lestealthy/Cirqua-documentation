# CIRQUA documentation - source registry
#
# Machine-readable companion to docs/references/source-registry.md.
#
# Every external source that informs a technical claim in this documentation
# MUST be recorded here. Claims are typed so a reader can tell a project fact
# from a firmware fact, a manufacturer specification, an engineering
# interpretation and a recommendation.
#
# authority levels
#   primary  - the organisation's own authoritative material
#   official - vendor documentation, standards body, RTOS/vendor reference
#   academic - peer-reviewed or institutional literature
#   community- non-authoritative; never allowed to override a manufacturer
#
# accessed dates are the day the source was retrieved and read.

metadata:
  project: CIRQUA Waterwise Futures
  documentation_repository: https://github.com/lestealthy/Cirqua-documentation
  documentation_revision: see repository history
  firmware_repository: https://github.com/lestealthy/Cirqua
  firmware_branch: main
  firmware_commit: db6d9b896341a9c7d8fd01913e854b663c110d55
  compiled: 2026-10-03
  policy: >-
    Claims that depend on external documentation must cite a source id from
    this registry. Project-level claims use the CIRQUA official site.
    Community sources never override manufacturer documentation.

sources:
  # ---------------------------------------------------------------------
  # Official project sources
  # ---------------------------------------------------------------------
  - id: CIRQUA_OFFICIAL
    title: CIRQUA Waterwise Futures (official project website)
    publisher: CIRQUA project consortium
    source_type: official_project
    url: https://cirqua-water.eu/
    accessed: '2026-10-03'
    used_for:
