  - id: LIT_CONSTRUCTED_WETLANDS
    title: Constructed wetlands for wastewater treatment - foundational literature
    publisher: Peer-reviewed literature (Vymazal; Kadlec and Wallace)
    source_type: academic
    url: https://doi.org/10.1007/s11273-005-3881-x
    accessed: '2026-10-03'
    used_for:
      - general background on constructed wetlands as a nature-based
        wastewater treatment technology, matching the CIRQUA project framing
    authority: academic
    notes: >-
      Cited as background science for the project domain, not to justify any
      specific firmware behaviour. Bibliographic details should be verified
      against the publisher before formal citation.

  - id: LIT_DO_SOLUBILITY
    title: 'Dissolved oxygen solubility in water - temperature dependence'
    publisher: Peer-reviewed / scientific literature
    source_type: academic
    url: ''
    accessed: '2026-10-03'
    used_for:
      - explaining that the Node 2 dissolved oxygen temperature compensation
        (-2 % per degree C, linear) is a coarse linear approximation of a
        genuinely non-linear solubility relationship
    authority: academic
    notes: >-
      No specific paper is asserted here. The documentation explains the
      firmware's approximation on first principles and flags it as an
      approximation without claiming a literature citation.

