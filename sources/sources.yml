      - Horizon Europe funding (4.09 million EUR)
      - project duration (36 months, April 2024 to March 2027)
      - consortium scale (13 partners, 10 countries, 3 continents)
      - constructed wetlands and water reuse objectives
      - mention of sensors and automation in operation
      - Mediterranean field application context
    authority: primary
    notes: >-
      Authoritative for all project-level claims. Project facts change over
      time; re-verify duration, funding and consortium figures before any
      publication or grant reporting.

  - id: CIRQUA_THE_PROJECT
    title: 'CIRQUA: The Project'
    publisher: CIRQUA project consortium
    source_type: official_project
    url: https://cirqua-water.eu/the-project/
    accessed: '2026-10-03'
