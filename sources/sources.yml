  - id: CIRQUA_FIRMWARE
    title: 'CIRQUA firmware (lestealthy/Cirqua)'
    publisher: WattLab Engineering
    source_type: source_code
    url: https://github.com/lestealthy/Cirqua
    accessed: '2026-10-03'
    used_for:
      - every GPIO assignment, task table, mutex, protocol frame, conversion
        formula, calibration constant, LCD layout and timing value in this
        documentation
    authority: primary
    notes: >-
      Pinned at commit db6d9b896341a9c7d8fd01913e854b663c110d55 on branch
      main, consumed through the _external/Cirqua-firmware submodule. The
      FreeRTOS_Implementation tree is current; _OLD is historical and is
